name: Deploy

# Builds both images, pushes them to GHCR, then updates the EC2 host over SSH.
# Required repository secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY, LLM_API_KEY,
# POSTGRES_PASSWORD, SITE_ADDRESS (your domain). Optional: LLM_PROVIDER.
# The workflow is skipped until EC2_HOST is set, so CI stays green before AWS exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: echo "enabled=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.tags.outputs.backend }}
      frontend: ${{ steps.tags.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "backend=$REGISTRY/$owner/autocare-ai-backend:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "frontend=$REGISTRY/$owner/autocare-ai-frontend:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.tags.outputs.backend }}
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/autocare-ai-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: VITE_REPO_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.tags.outputs.frontend }}
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/autocare-ai-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Write server .env
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
        run: |
          {
            echo "BACKEND_IMAGE=${{ needs.build.outputs.backend }}"
            echo "FRONTEND_IMAGE=${{ needs.build.outputs.frontend }}"
            echo "LLM_PROVIDER=${LLM_PROVIDER:-groq}"
            echo "LLM_API_KEY=$LLM_API_KEY"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "SITE_ADDRESS=$SITE_ADDRESS"
            echo "CORS_ORIGINS=https://$SITE_ADDRESS"
            echo "REPO_URL=${{ github.server_url }}/${{ github.repository }}"
          } > deploy.env
      - name: Copy compose file and env to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,deploy.env"
          target: "~/autocare-ai"
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/autocare-ai
            mv deploy.env .env && chmod 600 .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ secrets.SITE_ADDRESS }}/api/health"; then exit 0; fi
            sleep 10
          done
          echo "Health check failed" && exit 1
