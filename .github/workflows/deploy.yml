name: Deploy

# Deploys main to a Hugging Face Space (Docker, free CPU tier) after CI passes.
# Setup (once): repository secret HF_TOKEN (a write token from huggingface.co/settings/tokens),
# secret LLM_API_KEY (Groq), and repository variable HF_SPACE = "<hf-username>/autocare-ai".
# Optional secret DATABASE_URL (e.g. free Neon Postgres) to keep history across restarts.
# The job is skipped until HF_TOKEN exists, so CI stays green before then.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check configuration
        id: cfg
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: echo "enabled=$([ -n "$HF_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Upload to the Space
        if: steps.cfg.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: groq
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install "huggingface_hub>=0.30"
          python deploy/hf/push.py
      - name: Wait for the Space to come up
        if: steps.cfg.outputs.enabled == 'true'
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          url="https://$(echo "$HF_SPACE" | tr '/_' '--' | tr '[:upper:]' '[:lower:]').hf.space/api/health"
          echo "Polling $url"
          for i in $(seq 1 60); do
            if curl -fsS "$url"; then echo; exit 0; fi
            sleep 20
          done
          echo "Space did not become healthy in 20 minutes" && exit 1
