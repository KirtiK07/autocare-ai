[project]
name = "autocare-ai-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.15.0",
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "python-multipart==0.0.34",
    "httpx==0.28.1",
    "pandas==3.1.1",
    "numpy==2.5.5",
    "scikit-learn==1.9.1",
    "imbalanced-learn==0.14.2",
    "joblib==1.6.0",
    "pyyaml==6.0.4",
    "langchain-core==1.8.4",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.3",
    "langchain-chroma==1.1.0",
    "langchain-huggingface==1.2.3",
    "chromadb==1.5.9",
    "sentence-transformers==6.3.0",
    "pypdf==7.1.1",
]

# CPU-only PyTorch (the default PyPI wheel bundles CUDA and is several GB larger).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["B008", "N803", "N806", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["alembic/", "notebooks/", "tests/"]
